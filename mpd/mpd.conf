# Directories
music_directory "/home/john/Music/songs"
#playlist_directory ""

# Behaviour
auto_update "yes"
restore_paused "yes"

# Audio output
audio_output {
  type "pulse"
  name "pulse"
}

# Audio visializer
audio_output {
  type "fifo"
  name "Visualizer"
  path "/tmp/mpd.fifo"
  format "44100:16:2"
}
