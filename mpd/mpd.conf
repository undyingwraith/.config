# Directories
music_directory "~/Music"
playlist_directory "~/Music/_playlists"

# Behaviour
auto_update "yes"
restore_paused "yes"

# Audio output
audio_output {
  type "pulse"
  name "pulse"
}

# Audio visializer
audio_output {
  type "fifo"
  name "Visualizer"
  path "/tmp/mpd.fifo"
  format "44100:16:2"
}
